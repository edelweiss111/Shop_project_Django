
{% extends 'catalog/base.html' %}

{% block title %}Регистрация — sStore{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Регистрация</h1>
        <p class="auth-description">
            Создайте аккаунт, чтобы пользоваться возможностями sStore.
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Зарегистрироваться
            </button>
        </form>

        <div class="auth-footer">
            <p>Уже есть аккаунт?</p>
            <a href="{% url 'users:login' %}">
                Войти
            </a>
        </div>
    </div>
</section>
{% endblock %}
