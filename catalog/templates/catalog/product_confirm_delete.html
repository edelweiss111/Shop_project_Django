
{% extends 'catalog/base.html' %}

{% block title %}Удаление товара — sStore{% endblock %}

{% block content %}

<section class="delete-product-page">

    <div class="delete-product-card">

        <h1>Удаление товара</h1>

        <p>
            Вы действительно хотите удалить товар
            <strong>{{ object.name }}</strong>?
        </p>

        <p class="delete-product-warning">
            Это действие нельзя будет отменить.
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="delete-product-actions">

                <button type="submit" class="btn btn-danger">
                    Удалить
                </button>

                <a href="{% url 'catalog:products' %}"
                   class="btn btn-outline-secondary">
                    Отмена
                </a>

            </div>
        </form>

    </div>

</section>

{% endblock %}
